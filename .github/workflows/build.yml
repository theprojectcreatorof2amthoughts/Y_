name: Y_ build and compiler tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Install Clang
        run: |
          sudo apt-get update
          sudo apt-get install -y clang
      - name: Build interpreter and native compiler
        run: make clean && make
      - name: Test multi-error diagnostics
        run: make test-diagnostics
      - name: Check and compile a Y_ program
        run: |
          ./gyy --check examples/modern.yc
          ./gyy examples/modern.yc --optimize=2 --warn-all -o build/modern
          ./build/modern
          ./gyy examples/modern.yc -c -o build/modern-module.o
          test -f build/modern-module.o
          ./gyy build/modern-module.o -o build/modern-object-linked
          ./build/modern-object-linked
